name: Deploy AZ Portfolio

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: react-portfolio-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy React Portfolio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Build React application
        run: npm run build

      - name: Verify production assets
        run: |
          set -e

          test -f dist/index.html
          test -f dist/images/portfolio-banner-background.jpg
          test -f dist/images/portfolio-owner-picture.jpg
          test -f dist/images/project-placeholder.jpg

          echo "Production assets verified."

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh

          printf '%s\n' "${{ secrets.LINODE_SSH_KEY }}" > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "${{ secrets.LINODE_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy production files
        run: |
          rsync -az --delete \
            ./dist/ \
            "${{ secrets.LINODE_USER }}@${{ secrets.LINODE_HOST }}:/var/www/html/portfolio.adrian-zalewski.com/public_html/"

      - name: Verify production deployment
        run: |
          ssh "${{ secrets.LINODE_USER }}@${{ secrets.LINODE_HOST }}" << 'EOF'
            set -e

            APP="/var/www/html/portfolio.adrian-zalewski.com/public_html"

            test -f "$APP/index.html"
            test -f "$APP/images/portfolio-banner-background.jpg"
            test -f "$APP/images/portfolio-owner-picture.jpg"
            test -f "$APP/images/project-placeholder.jpg"

            echo "Production deployment verified."
          EOF